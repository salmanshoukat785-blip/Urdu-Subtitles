name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f UrduYTSubs.zip || { echo "UrduYTSubs.zip repo ke root me nahi mili"; exit 1; }
          unzip -q UrduYTSubs.zip -d project
          ls project/UrduYTSubs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -p project/UrduYTSubs

      - uses: actions/upload-artifact@v4
        with:
          name: UrduYTSubs-apk
          path: project/UrduYTSubs/app/build/outputs/apk/debug/app-debug.apk
